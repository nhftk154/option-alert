name: Send daily EOD report

on:
  schedule:
    # 21:30 UTC - after NYSE close under both EDT (20:00 UTC) and EST (21:00 UTC).
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eod_report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Send report
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          PYTHONPATH: src
        run: python -m optionalert.run_eod_report
