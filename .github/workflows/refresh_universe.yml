name: Refresh S&P universe cache

on:
  schedule:
    # Saturday - market closed, no overlap risk with scan.yml's Sheets cooldown.
    - cron: '0 10 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh_universe:
    runs-on: ubuntu-latest
    # Measured locally: 14m36s sequential (one ticker, MRK, hit yfinance's own
    # ~5min internal HTTP timeout with nothing else able to proceed while it
    # blocked). universe.py's rank_by_market_cap now fetches concurrently
    # (10 workers), which lets the other ~500 tickers finish almost
    # immediately regardless of stragglers - but a stuck fetch still isn't
    # forcibly cancellable, so the true worst case is still bounded by
    # yfinance's own timeout, not by us. 25 minutes covers that plus room for
    # more than one straggler; this job only runs once a week, so a longer
    # ceiling costs nothing.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Build universe cache
        env:
          PYTHONPATH: src
        run: python -m optionalert.run_refresh_universe

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/universe_cache.json
          git diff --staged --quiet || git commit -m "chore: refresh universe cache"
          git push
