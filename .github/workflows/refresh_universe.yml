name: Refresh S&P universe cache

on:
  schedule:
    # Saturday - market closed, no overlap risk with scan.yml's Sheets cooldown.
    - cron: '0 10 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh_universe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Build universe cache
        env:
          PYTHONPATH: src
        run: python -m optionalert.run_refresh_universe

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/universe_cache.json
          git diff --staged --quiet || git commit -m "chore: refresh universe cache"
          git push
