name: Scan for unusual options activity

on:
  schedule:
    # Each run is a long-lived loop (run_scan.py --loop) that waits for the
    # open and then scans every 10 minutes until the close - so a schedule
    # only has to fire once, roughly on time. A */10 cron was measured firing
    # just 1-3 times a day, hours late. Several start times spread across the
    # day make it very likely at least one fires during market hours; while a
    # loop is running, later ones queue behind it (concurrency group below)
    # and exit immediately once the market has closed. All times UTC; the
    # exact open/close (DST, holidays, early closes) is checked in Python.
    - cron: '7 12 * * 1-5'
    - cron: '37 13 * * 1-5'
    - cron: '7 15 * * 1-5'
    - cron: '37 16 * * 1-5'
    - cron: '7 18 * * 1-5'
    - cron: '37 19 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print alerts instead of sending/writing'
        type: boolean
        default: false
      tickers:
        description: 'Comma-separated ticker override (bypasses sharding)'
        type: string
        default: ''

concurrency:
  # Scheduled loop runs share one group (one loop at a time, the next queued
  # behind it). A manual --tickers test gets its own group so it never waits
  # hours behind a running loop.
  group: scan-${{ inputs.tickers || 'loop' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # lets a loop that hit its runtime limit start the next one

jobs:
  scan:
    runs-on: ubuntu-latest
    # A --loop job runs for up to a whole trading session. GitHub's hard cap
    # per job is 6h; run_scan.py stops itself at 5h40m (LOOP_MAX_RUNTIME) and
    # the next queued run takes over. A manual --tickers run takes ~1-2 min.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TVREMIX_API_KEY: ${{ secrets.TVREMIX_API_KEY }}
          PYTHONPATH: src
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.tickers }}" ]; then ARGS="$ARGS --tickers ${{ inputs.tickers }}"; else ARGS="$ARGS --loop"; fi
          python -m optionalert.run_scan $ARGS

      - name: Hand off to a new loop run
        # run_scan.py leaves this marker when it stopped on its runtime limit
        # while the market is still open. GitHub's cron can't be relied on to
        # fire in time (measured: often hours late or not at all), so start
        # the next loop directly; it queues behind this job's concurrency group.
        if: always() && hashFiles('scan_handoff_needed') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scan.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
